name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest bandit safety
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          # Stop the build only on Python syntax errors (E9, F63, F7)
          flake8 . --count --select=E9,F63,F7 --show-source --statistics
          # Show other issues as warnings (don't fail)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Security scan with bandit
        run: |
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . -ll || true

      - name: Check dependencies for known vulnerabilities
        run: |
          if [ -f requirements.txt ]; then
            safety check -r requirements.txt --full-report || true
          fi

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            python -m pytest tests/ -v || true
          fi

      - name: Shell script syntax check
        run: |
          find . -name "*.sh" -exec bash -n {} \; 2>&1

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report-py${{ matrix.python-version }}
          path: bandit-report.json
          retention-days: 30
