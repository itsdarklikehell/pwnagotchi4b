name: Gource visualization

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gource:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gource
        uses: nbprojekt/gource-action@57256d303c5a9a5e72ed92ba13e3e83c5ec8b257 # v1.3.0
        with:
          gource_resolution: 1080p
          gource_fps: 60
          gource_filename_time: 3
          gource_hide_items: 'mouse,date,filenames'
          gource_max_files: 1500
          gource_highlight_users: true
          gource_output_framerate: 30
          gource_stop_at_end: true
          gource_auto_skip_seconds: 0.1
          gource_multi_sampling: true
          gource_title: 'pwnagotchi4b development timeline — incl. /health endpoint (peer status)'
          gource_user_scale: 1.0
          gource_seconds_per_day: 0.4

      # /health endpoint (feat: add detailed /health endpoint with peer status — 0773fa7)
      # Returns server version, uptime, task counts, and peer list as JSON.

      - name: Install ffmpeg (runner)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Upscale + re-encode
        run: |
          ffmpeg -y -i ./gource/gource.mp4 \
            -c:v libx264 -crf 18 -level 4.1 -preset medium -tune film \
            -filter:v "scale=-1:1080" -sws_flags lanczos \
            -c:a aac -b:a 192k -ar 48000 \
            -movflags +faststart \
            ./gource.mp4

      - name: Upload video
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.event.repository.name }}-gource
          path: ./gource.mp4

      - name: Commit gource video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gource.mp4 || true
          git diff --staged --quiet || git commit -m "ci: update gource visualization (automated)"
          git push
